# SonarCloud (connected via GitHub app, automatic analysis — no CI scanner step).
# Property reference: https://docs.sonarsource.com/sonarqube-server/10.6/analyzing-source-code/analysis-parameters/

# --- Project identity (edit to your SonarCloud org/key if auto-detection differs) ---
# sonar.organization=life-in-a-sound
# sonar.projectKey=life-in-a-sound_life-in-a-sound

# --- Paths ---
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=src/convex/_generated/**,src/components/ui/**

# --- Duplication (CPD) tuning ---
# Dictionaries are translated *data tables*: every locale repeats the same key
# structure by design (one line per translated string). There is no logic to
# deduplicate — a shared abstraction cannot remove the per-locale lines, only
# hide them. Excluding them from copy-paste detection removes the false
# positive without weakening any real-code check (coverage, smells, bugs are
# unaffected).
sonar.cpd.exclusions=**/i18n/dictionaries.ts
